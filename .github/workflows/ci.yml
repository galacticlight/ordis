name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  package-darwin-arm64:
    name: darwin-arm64 package
    runs-on: macos-14
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Vendor q8 Kokoro ONNX and espeak-ng
        run: node scripts/vendorVoiceExtras.cjs
      - name: Package unsigned darwin-arm64 dir
        run: npx electron-builder --mac dir --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ordis-darwin-arm64
          path: |
            release/mac-arm64
            release/mac
          if-no-files-found: error
