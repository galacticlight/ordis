<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:*; media-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordis</title>
  </head>
  <body class="idle">
    <div id="app">
      <canvas id="avatar" aria-label="Ordis companion"></canvas>
      <div id="hit" class="hit" title="Wake Ordis"></div>
      <div id="caption" class="caption" hidden></div>
      <div id="chrome" class="chrome">
        <button type="button" id="btn-tuck" title="Return to idle">Idle</button>
        <button type="button" id="btn-settings" title="Settings">Settings</button>
      </div>
      <form id="chat" class="chat">
        <input id="prompt" type="text" autocomplete="off" placeholder="Speak, Operator…" aria-label="Message to Ordis" />
        <button type="submit">Transmit</button>
      </form>
    </div>
    <script type="module" src="./src/overlay.ts"></script>
  </body>
</html>
