appId: com.galacticlight.ordis
productName: Ordis
copyright: Copyright © 2026 Prince Thai
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
linux:
  target:
    - dir
  category: Utility
  synopsis: Real-time desktop AI companion
mac:
  target:
    - target: dir
      arch:
        - arm64
  category: public.app-category.utilities
  identity: null
  extendInfo:
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: true
win:
  target:
    - dir
asar: true

extraResources:
  - from: personality
    to: personality
  - from: resources/icon.png
    to: icon.png
